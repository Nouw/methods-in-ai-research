files:
  patterns_path: "slot_patterns.json"
  aliases_path: "alias_suggestions.json"
  ontology_path: "ontology.json"

matching:
  use_levenshtein: true
  use_semantic: false
  use_ontology_alias: true
  levenshtein_threshold: 0.55
  semantic_threshold: 0.84
  min_fuzzy_chars: 4
  max_pattern_value_tokens: 5
  pattern_leading_stopwords: ["a", "an", "the"]
  max_leading_stopwords: 2

slots:
  allowed_slots: ["attr", "pricerange", "area", "food"]
  slot_name_map:
    "price range": "pricerange"
    "price": "pricerange"
  attr_values: ["name", "phone", "addr", "postcode"]
  attr:
    multi_value: true
    aliases:
      name:
        - "restaurant name"
        - "name of the restaurant"
        - "name of restaurant"
        - "name"
      phone:
        - "phone number"
        - "phonenumber"
        - "phone no"
        - "telephone number"
        - "telephone"
        - "phone"
        - "mobile"
        - "tel"
      addr:
        - "restaurant address"
        - "address"
        - "addr"
        - "restaurant location"
        - "location"
      postcode:
        - "postal code"
        - "post code"
        - "postcode"
        - "zip code"
        - "zipcode"
        - "pin code"
        - "pincode"
  special_aliases:
    dontcare: ["any", "anything", "whatever", "dont care", "don't care", "doesn't matter", "does not matter", "no preference"]
